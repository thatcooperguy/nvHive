<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1320" font-family="'SF Mono','Menlo','Monaco','Courier New',monospace" font-size="12.5">
  <!-- Terminal Window -->
  <rect width="860" height="1320" rx="10" fill="#1a1a2e"/>
  <!-- Title Bar -->
  <rect width="860" height="36" rx="10" fill="#16213e"/>
  <rect y="26" width="860" height="10" fill="#16213e"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27c93f"/>
  <text x="430" y="22" fill="#a0a0b0" text-anchor="middle" font-size="12">nvHive v0.29 — First Run Experience</text>

  <!-- Install -->
  <text x="20" y="60" fill="#76B900" font-weight="bold">$</text>
  <text x="36" y="60" fill="#e0e0e0">pip install "nvhive[vision]"</text>
  <text x="20" y="78" fill="#888">Successfully installed nvhive-0.29.3</text>
  <text x="20" y="98" fill="#76B900" font-weight="bold">$</text>
  <text x="36" y="98" fill="#e0e0e0">nvh</text>

  <!-- Welcome Panel -->
  <rect x="20" y="114" width="600" height="68" rx="6" fill="none" stroke="#27c93f" stroke-width="1.5"/>
  <text x="34" y="134" fill="#27c93f" font-weight="bold">Welcome to nvHive</text>
  <text x="34" y="154" fill="#c8c8c8" font-size="11.5">This one-time setup detects your hardware, sets up local AI,</text>
  <text x="34" y="170" fill="#c8c8c8" font-size="11.5">and configures cloud providers. Press Enter to skip any step.</text>

  <!-- Step 1: Hardware + Local AI -->
  <text x="20" y="206" fill="#27c93f" font-weight="bold">Step 1/3:</text>
  <text x="110" y="206" fill="#e0e0e0">Hardware + Local AI</text>

  <text x="34" y="230" fill="#666">GPU</text>
  <text x="130" y="230" fill="#e0e0e0">NVIDIA GeForce RTX 4080 (48 GB VRAM)</text>
  <text x="34" y="248" fill="#666">Total VRAM</text>
  <text x="130" y="248" fill="#e0e0e0">48 GB</text>
  <text x="34" y="266" fill="#666">Agent Tier</text>
  <text x="130" y="266" fill="#e0e0e0">tier_3 - Cloud orchestrator + 70B local worker</text>

  <!-- Ollama Install -->
  <text x="34" y="294" fill="#e0e0e0">Ollama is not installed. Download it now? [Y/n]</text>
  <text x="455" y="294" fill="#76B900">Y</text>
  <text x="34" y="314" fill="#e0e0e0">Downloading Ollama (this is ~2 GB — includes CUDA libraries)...</text>
  <text x="40" y="334" fill="#00bcd4" font-weight="bold">Ollama</text>
  <rect x="110" y="324" width="400" height="14" rx="3" fill="#333"/>
  <rect x="110" y="324" width="400" height="14" rx="3" fill="#27c93f"/>
  <text x="520" y="335" fill="#c8c8c8" font-size="11">2.1/2.1 GB  247 MB/s  0:00:00</text>
  <text x="34" y="356" fill="#e0e0e0">Extracting Ollama (this may take a moment)...</text>
  <text x="34" y="374" fill="#27c93f">Extraction complete.</text>
  <text x="34" y="392" fill="#27c93f">Installed Ollama to /home/kiosk/.nvh/bin/ollama</text>

  <text x="34" y="416" fill="#e0e0e0">Starting Ollama...</text>
  <text x="34" y="434" fill="#27c93f">Ollama is running.</text>

  <!-- Model Recommendations -->
  <text x="34" y="460" fill="#e0e0e0">Recommended models for your GPU (48 GB VRAM):</text>
  <text x="48" y="482" fill="#666">available</text>
  <text x="130" y="482" fill="#e0e0e0">llama3.3:70b</text>
  <text x="48" y="500" fill="#666">available</text>
  <text x="130" y="500" fill="#e0e0e0">llama3.2-vision</text>

  <text x="34" y="524" fill="#e0e0e0">Pull 2 recommended model(s)? [Y/n]</text>
  <text x="345" y="524" fill="#76B900">Y</text>

  <!-- Model Pull Progress -->
  <text x="40" y="548" fill="#00bcd4" font-weight="bold">llama3.3:70b: success</text>
  <rect x="230" y="538" width="350" height="14" rx="3" fill="#333"/>
  <rect x="230" y="538" width="350" height="14" rx="3" fill="#27c93f"/>
  <text x="590" y="549" fill="#c8c8c8" font-size="11">40.0 GB  185 MB/s</text>
  <text x="34" y="568" fill="#27c93f">Pulled llama3.3:70b.</text>

  <text x="40" y="590" fill="#00bcd4" font-weight="bold">llama3.2-vision: success</text>
  <rect x="250" y="580" width="330" height="14" rx="3" fill="#333"/>
  <rect x="250" y="580" width="330" height="14" rx="3" fill="#27c93f"/>
  <text x="590" y="591" fill="#c8c8c8" font-size="11">7.0 GB  210 MB/s</text>
  <text x="34" y="610" fill="#27c93f">Pulled llama3.2-vision.</text>
  <text x="34" y="630" fill="#27c93f">Desktop agent: ready (vision model loaded)</text>

  <!-- Divider -->
  <line x1="20" y1="648" x2="840" y2="648" stroke="#333" stroke-width="1"/>

  <!-- Step 2: Provider Status -->
  <text x="20" y="670" fill="#27c93f" font-weight="bold">Step 2/3:</text>
  <text x="110" y="670" fill="#e0e0e0">Provider status</text>

  <text x="34" y="694" fill="#00bcd4" font-weight="bold">Provider</text>
  <text x="180" y="694" fill="#00bcd4" font-weight="bold">Status</text>
  <text x="400" y="694" fill="#00bcd4" font-weight="bold">Signup</text>
  <text x="34" y="714" fill="#e0e0e0" font-weight="bold">Groq</text>
  <text x="180" y="714" fill="#ffbd2e">not configured</text>
  <text x="400" y="714" fill="#666" font-size="11">https://console.groq.com/keys</text>
  <text x="34" y="732" fill="#e0e0e0" font-weight="bold">OpenAI</text>
  <text x="180" y="732" fill="#ffbd2e">not configured</text>
  <text x="400" y="732" fill="#666" font-size="11">https://platform.openai.com/api-keys</text>
  <text x="34" y="750" fill="#e0e0e0" font-weight="bold">Anthropic</text>
  <text x="180" y="750" fill="#ffbd2e">not configured</text>
  <text x="400" y="750" fill="#666" font-size="11">https://console.anthropic.com</text>
  <text x="34" y="768" fill="#e0e0e0" font-weight="bold">Google Gemini</text>
  <text x="180" y="768" fill="#ffbd2e">not configured</text>
  <text x="400" y="768" fill="#666" font-size="11">https://aistudio.google.com/apikey</text>
  <text x="34" y="786" fill="#e0e0e0" font-weight="bold">Ollama (local)</text>
  <text x="180" y="786" fill="#27c93f">running</text>
  <text x="240" y="786" fill="#27c93f">(2 models)</text>

  <!-- Divider -->
  <line x1="20" y1="804" x2="840" y2="804" stroke="#333" stroke-width="1"/>

  <!-- Step 3: API Keys with Desktop Agent -->
  <text x="20" y="826" fill="#27c93f" font-weight="bold">Step 3/3:</text>
  <text x="110" y="826" fill="#e0e0e0">Configure API keys</text>

  <text x="34" y="850" fill="#888" font-size="11.5">Desktop agent is ready! For each provider I'll:</text>
  <text x="34" y="866" fill="#888" font-size="11.5">  1. Open the signup page in your browser</text>
  <text x="34" y="882" fill="#888" font-size="11.5">  2. Take a screenshot to verify the page</text>
  <text x="34" y="898" fill="#888" font-size="11.5">  3. Watch your clipboard for the API key</text>

  <text x="34" y="922" fill="#e0e0e0">Open Groq signup page in browser? [Y/n]</text>
  <text x="395" y="922" fill="#76B900">Y</text>
  <text x="34" y="940" fill="#888">Opened https://console.groq.com/keys</text>
  <text x="34" y="958" fill="#888" font-size="11">Agent: I see the Groq console dashboard. There is an "API Keys" section with</text>
  <text x="34" y="974" fill="#888" font-size="11">a "Create API Key" button. Click it to generate a new key.</text>
  <text x="34" y="992" fill="#888" font-size="11">Watching clipboard for 60s — copy your API key from the browser...</text>
  <text x="34" y="1010" fill="#27c93f">Detected key: gsk_xR...CmLa</text>
  <text x="34" y="1028" fill="#27c93f">Saved Groq key.</text>

  <!-- Summary Panel -->
  <rect x="20" y="1052" width="600" height="30" rx="6" fill="none" stroke="#27c93f" stroke-width="1.5"/>
  <text x="34" y="1072" fill="#27c93f" font-weight="bold">Setup complete!</text>
  <text x="168" y="1072" fill="#c8c8c8">4 provider(s) configured, 48 GB VRAM, desktop agent ready.</text>

  <!-- Divider -->
  <line x1="20" y1="1098" x2="840" y2="1098" stroke="#333" stroke-width="1"/>

  <!-- Using nvhive after setup -->
  <text x="20" y="1120" fill="#76B900">  &gt;</text>
  <text x="40" y="1120" fill="#e0e0e0">take a screenshot and describe what you see</text>
  <text x="20" y="1140" fill="#888">  [agent mode → take a screenshot and describe what you see]</text>
  <text x="20" y="1160" fill="#00bcd4">  Step 1:</text>
  <text x="90" y="1160" fill="#c8c8c8">capture_screenshot → screenshot.png (245.3 KB)</text>
  <text x="20" y="1178" fill="#00bcd4">  Step 2:</text>
  <text x="90" y="1178" fill="#c8c8c8">analyze_image → [Vision: llama3.2-vision:11b]</text>
  <text x="20" y="1198" fill="#c8c8c8">  I see an Ubuntu desktop with Konsole open. The Groq API page is</text>
  <text x="20" y="1216" fill="#c8c8c8">  visible in Firefox behind the terminal. The taskbar shows the</text>
  <text x="20" y="1234" fill="#c8c8c8">  system clock reads 2:15 PM and the NVIDIA GPU indicator is active.</text>
  <text x="20" y="1256" fill="#666">  2 step(s) | 2 tool call(s) | 8.3s | completed</text>

  <!-- Bottom bar -->
  <rect y="1278" width="860" height="42" rx="0" fill="#16213e"/>
  <rect y="1278" width="860" height="2" fill="#333"/>
  <text x="20" y="1296" fill="#76B900" font-size="11">GPU: RTX 4080 48GB | Ollama: 2 models | Vision: llama3.2-vision | Desktop Agent: ready</text>
  <text x="20" y="1312" fill="#666" font-size="10">pip install "nvhive[vision]" — https://github.com/thatcooperguy/nvHive</text>
</svg>
