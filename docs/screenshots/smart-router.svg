<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#111111"/><stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="nv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76B900"/><stop offset="100%" style="stop-color:#5a8f00"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="300" rx="12" fill="url(#bg)"/>

  <!-- Input box -->
  <rect x="30" y="30" width="160" height="240" rx="10" fill="#161616" stroke="#333" stroke-width="1.5"/>
  <rect x="30" y="30" width="160" height="4" rx="2" fill="#76B900"/>
  <text x="110" y="70" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Your Input</text>
  <text x="110" y="100" text-anchor="middle" fill="#666" font-size="11">nvh "..."</text>
  <text x="110" y="120" text-anchor="middle" fill="#666" font-size="11">> question</text>
  <text x="110" y="140" text-anchor="middle" fill="#666" font-size="11">POST /v1/smart</text>
  <line x1="55" y1="158" x2="165" y2="158" stroke="#222" stroke-width="1"/>
  <text x="110" y="180" text-anchor="middle" fill="#555" font-size="10">CLI</text>
  <text x="110" y="196" text-anchor="middle" fill="#555" font-size="10">REPL</text>
  <text x="110" y="212" text-anchor="middle" fill="#555" font-size="10">WebUI</text>
  <text x="110" y="228" text-anchor="middle" fill="#555" font-size="10">API / MCP</text>

  <!-- Arrow -->
  <polygon points="200,150 212,143 212,146 230,146 230,154 212,154 212,157" fill="#76B900"/>

  <!-- Router box -->
  <rect x="240" y="30" width="180" height="240" rx="10" fill="#161616" stroke="#76B900" stroke-width="2"/>
  <rect x="240" y="30" width="180" height="4" rx="2" fill="#76B900"/>
  <text x="330" y="65" text-anchor="middle" fill="#76B900" font-size="15" font-weight="bold">Smart Router</text>
  <line x1="265" y1="78" x2="395" y2="78" stroke="#222" stroke-width="1"/>
  <text x="330" y="100" text-anchor="middle" fill="#888" font-size="11">Intent detection</text>
  <text x="330" y="120" text-anchor="middle" fill="#888" font-size="11">Task classification</text>
  <line x1="265" y1="133" x2="395" y2="133" stroke="#222" stroke-width="1"/>
  <text x="330" y="153" text-anchor="middle" fill="#888" font-size="11">Capability  40%</text>
  <text x="330" y="173" text-anchor="middle" fill="#888" font-size="11">Cost  30%</text>
  <text x="330" y="193" text-anchor="middle" fill="#888" font-size="11">Latency  20%</text>
  <text x="330" y="213" text-anchor="middle" fill="#888" font-size="11">Health  10%</text>
  <line x1="265" y1="226" x2="395" y2="226" stroke="#222" stroke-width="1"/>
  <text x="330" y="248" text-anchor="middle" fill="#76B900" font-size="10" font-weight="bold">Learns from every query</text>

  <!-- Arrows out -->
  <line x1="430" y1="66" x2="470" y2="66" stroke="#76B900" stroke-width="1.5"/>
  <line x1="430" y1="114" x2="470" y2="114" stroke="#76B900" stroke-width="1.5"/>
  <line x1="430" y1="162" x2="470" y2="162" stroke="#76B900" stroke-width="1.5"/>
  <line x1="430" y1="206" x2="470" y2="206" stroke="#76B900" stroke-width="1.5"/>
  <line x1="430" y1="248" x2="470" y2="248" stroke="#76B900" stroke-width="1.5"/>

  <!-- Mode boxes -->
  <rect x="480" y="46" width="200" height="40" rx="8" fill="url(#nv)"/>
  <text x="580" y="64" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Instant</text>
  <text x="580" y="80" text-anchor="middle" fill="#c8e8a8" font-size="10">open, install, kill — $0.00</text>

  <rect x="480" y="94" width="200" height="40" rx="8" fill="#1a2a1a" stroke="#76B900" stroke-width="1.5"/>
  <text x="580" y="112" text-anchor="middle" fill="#76B900" font-size="13" font-weight="bold">Desktop Agent</text>
  <text x="580" y="128" text-anchor="middle" fill="#5a8a3a" font-size="10">screenshot, vision, click — $0.00</text>

  <rect x="480" y="142" width="200" height="40" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="1.5"/>
  <text x="580" y="160" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Query</text>
  <text x="580" y="176" text-anchor="middle" fill="#777" font-size="10">best advisor, routed — $0.00</text>

  <rect x="480" y="190" width="200" height="40" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="1.5"/>
  <text x="580" y="208" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Coding Agent</text>
  <text x="580" y="224" text-anchor="middle" fill="#777" font-size="10">plan, code, review, QA — ~$0.02</text>

  <rect x="480" y="232" width="200" height="40" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="1.5"/>
  <text x="580" y="250" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Council</text>
  <text x="580" y="266" text-anchor="middle" fill="#777" font-size="10">3+ models, synthesized — ~$0.10</text>

  <!-- Examples -->
  <rect x="710" y="30" width="360" height="240" rx="10" fill="#161616" stroke="#333" stroke-width="1.5"/>
  <rect x="710" y="30" width="360" height="4" rx="2" fill="#76B900"/>
  <text x="890" y="58" text-anchor="middle" fill="#888" font-size="13" font-weight="bold">Examples</text>

  <text x="730" y="84" fill="#76B900" font-size="12">$</text>
  <text x="745" y="84" fill="#ddd" font-size="12">open firefox</text>
  <text x="980" y="84" fill="#555" font-size="11">instant</text>

  <text x="730" y="110" fill="#76B900" font-size="12">$</text>
  <text x="745" y="110" fill="#ddd" font-size="12">take a screenshot</text>
  <text x="980" y="110" fill="#555" font-size="11">agent</text>

  <text x="730" y="136" fill="#76B900" font-size="12">$</text>
  <text x="745" y="136" fill="#ddd" font-size="12">what is python?</text>
  <text x="980" y="136" fill="#555" font-size="11">query</text>

  <text x="730" y="162" fill="#76B900" font-size="12">$</text>
  <text x="745" y="162" fill="#ddd" font-size="12">fix the bug in auth.py</text>
  <text x="980" y="162" fill="#555" font-size="11">coding</text>

  <text x="730" y="188" fill="#76B900" font-size="12">$</text>
  <text x="745" y="188" fill="#ddd" font-size="12">compare Redis vs Postgres</text>
  <text x="980" y="188" fill="#555" font-size="11">council</text>

  <text x="730" y="214" fill="#76B900" font-size="12">$</text>
  <text x="745" y="214" fill="#ddd" font-size="12">setup comfyui</text>
  <text x="980" y="214" fill="#555" font-size="11">agent</text>

  <text x="730" y="240" fill="#76B900" font-size="12">$</text>
  <text x="745" y="240" fill="#ddd" font-size="12">use anthropic</text>
  <text x="980" y="240" fill="#555" font-size="11">/advisor</text>

  <text x="730" y="262" fill="#76B900" font-size="12">$</text>
  <text x="745" y="262" fill="#ddd" font-size="12">clear</text>
  <text x="980" y="262" fill="#555" font-size="11">/clear</text>
</svg>
