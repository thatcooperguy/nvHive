<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/><stop offset="100%" style="stop-color:#1a0a30"/>
    </linearGradient>
    <linearGradient id="gg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76B900"/><stop offset="100%" style="stop-color:#5a9400"/>
    </linearGradient>
    <linearGradient id="gb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2979FF"/><stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="gp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#AA00FF"/><stop offset="100%" style="stop-color:#7B1FA2"/>
    </linearGradient>
    <linearGradient id="go" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6D00"/><stop offset="100%" style="stop-color:#E65100"/>
    </linearGradient>
    <linearGradient id="gc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF"/><stop offset="100%" style="stop-color:#0097A7"/>
    </linearGradient>
    <linearGradient id="gd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD600"/><stop offset="100%" style="stop-color:#F9A825"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="300" rx="16" fill="url(#bg)"/>

  <!-- Input -->
  <rect x="30" y="50" width="170" height="200" rx="14" fill="#122a12" stroke="#76B900" stroke-width="2"/>
  <text x="115" y="100" text-anchor="middle" fill="#76B900" font-size="16" font-weight="bold">Your Input</text>
  <text x="115" y="130" text-anchor="middle" fill="#8aaa60" font-size="11">nvh "..."</text>
  <text x="115" y="150" text-anchor="middle" fill="#8aaa60" font-size="11">> question</text>
  <text x="115" y="170" text-anchor="middle" fill="#8aaa60" font-size="11">POST /v1/smart</text>
  <text x="115" y="200" text-anchor="middle" fill="#8aaa60" font-size="10">CLI, REPL, WebUI, API</text>

  <!-- Arrow -->
  <polygon points="210,150 222,140 222,145 240,145 240,155 222,155 222,160" fill="#76B900"/>

  <!-- Router -->
  <rect x="250" y="50" width="180" height="200" rx="14" fill="#20200a" stroke="#FFD600" stroke-width="2.5"/>
  <text x="340" y="90" text-anchor="middle" fill="#FFD600" font-size="16" font-weight="bold">Smart Router</text>
  <text x="340" y="115" text-anchor="middle" fill="#bbaa44" font-size="10">Intent detection</text>
  <text x="340" y="135" text-anchor="middle" fill="#bbaa44" font-size="10">Task classification</text>
  <text x="340" y="155" text-anchor="middle" fill="#bbaa44" font-size="10">Provider scoring</text>
  <text x="340" y="175" text-anchor="middle" fill="#bbaa44" font-size="10">Capability 40%</text>
  <text x="340" y="195" text-anchor="middle" fill="#bbaa44" font-size="10">Cost 30% Latency 20%</text>
  <text x="340" y="215" text-anchor="middle" fill="#bbaa44" font-size="10">Health 10%</text>
  <text x="340" y="240" text-anchor="middle" fill="#FFD600" font-size="9" font-weight="bold">Learns from every query</text>

  <!-- Arrows out -->
  <line x1="440" y1="80" x2="480" y2="80" stroke="#76B900" stroke-width="2"/>
  <line x1="440" y1="120" x2="480" y2="120" stroke="#FF6D00" stroke-width="2"/>
  <line x1="440" y1="160" x2="480" y2="160" stroke="#2979FF" stroke-width="2"/>
  <line x1="440" y1="200" x2="480" y2="200" stroke="#AA00FF" stroke-width="2"/>
  <line x1="440" y1="240" x2="480" y2="240" stroke="#00E5FF" stroke-width="2"/>

  <!-- Mode boxes -->
  <rect x="490" y="58" width="180" height="44" rx="10" fill="url(#gg)"/>
  <text x="580" y="77" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Instant  $0.00</text>
  <text x="580" y="94" text-anchor="middle" fill="#c8e8a8" font-size="10">open, install, kill</text>

  <rect x="490" y="108" width="180" height="44" rx="10" fill="url(#go)"/>
  <text x="580" y="127" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Agent  $0.00</text>
  <text x="580" y="144" text-anchor="middle" fill="#ffd8a0" font-size="10">screenshot, setup, tasks</text>

  <rect x="490" y="158" width="180" height="44" rx="10" fill="url(#gb)"/>
  <text x="580" y="177" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Query  $0.00</text>
  <text x="580" y="194" text-anchor="middle" fill="#a0c8ff" font-size="10">best advisor, smart-routed</text>

  <rect x="490" y="208" width="180" height="44" rx="10" fill="url(#gp)"/>
  <text x="580" y="227" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Coding  ~$0.02</text>
  <text x="580" y="244" text-anchor="middle" fill="#d8b0f8" font-size="10">plan, code, review, QA</text>

  <rect x="490" y="248" width="180" height="44" rx="10" fill="url(#gc)"/>
  <text x="580" y="267" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Council  ~$0.10</text>
  <text x="580" y="282" text-anchor="middle" fill="#a0eeff" font-size="10">3+ models, synthesized</text>

  <!-- Example column -->
  <rect x="690" y="30" width="390" height="260" rx="14" fill="#0a1520" stroke="#445566" stroke-width="1.5"/>
  <text x="885" y="55" text-anchor="middle" fill="#8899aa" font-size="14" font-weight="bold">Examples</text>

  <text x="710" y="82" fill="#76B900" font-size="12" font-weight="bold">></text>
  <text x="725" y="82" fill="#d7d7d7" font-size="12">open firefox</text>
  <text x="900" y="82" fill="#555" font-size="11">-> instant</text>

  <text x="710" y="115" fill="#76B900" font-size="12" font-weight="bold">></text>
  <text x="725" y="115" fill="#d7d7d7" font-size="12">take a screenshot</text>
  <text x="900" y="115" fill="#555" font-size="11">-> agent</text>

  <text x="710" y="148" fill="#76B900" font-size="12" font-weight="bold">></text>
  <text x="725" y="148" fill="#d7d7d7" font-size="12">what is python?</text>
  <text x="900" y="148" fill="#555" font-size="11">-> query</text>

  <text x="710" y="181" fill="#76B900" font-size="12" font-weight="bold">></text>
  <text x="725" y="181" fill="#d7d7d7" font-size="12">fix the bug in auth.py</text>
  <text x="900" y="181" fill="#555" font-size="11">-> coding</text>

  <text x="710" y="214" fill="#76B900" font-size="12" font-weight="bold">></text>
  <text x="725" y="214" fill="#d7d7d7" font-size="12">compare Redis vs Postgres</text>
  <text x="900" y="214" fill="#555" font-size="11">-> council</text>

  <text x="710" y="247" fill="#76B900" font-size="12" font-weight="bold">></text>
  <text x="725" y="247" fill="#d7d7d7" font-size="12">setup comfyui</text>
  <text x="900" y="247" fill="#555" font-size="11">-> agent</text>

  <text x="710" y="277" fill="#76B900" font-size="12" font-weight="bold">></text>
  <text x="725" y="277" fill="#d7d7d7" font-size="12">use anthropic</text>
  <text x="900" y="277" fill="#555" font-size="11">-> /advisor</text>
</svg>
