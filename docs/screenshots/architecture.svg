  <text x="500" y="146" text-anchor="middle" fill="#76B900" font-size="10">[serve]</text>
  <rect x="555" y="130" width="90" height="24" rx="6" fill="url(#nv)"/>
  <text x="600" y="146" text-anchor="middle" fill="white" font-size="10" font-weight="bold">[all]</text>

