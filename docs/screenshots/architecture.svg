  <text x="373" y="293" fill="#2979FF" font-size="20" font-weight="bold">-></text>

  <rect x="398" y="260" width="260" height="58" rx="12" fill="url(#g2)"/>
  <text x="528" y="282" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Step 2: Provider Status</text>
  <text x="528" y="300" text-anchor="middle" fill="#a0c8ff" font-size="11">Ollama running + cloud check</text>

  <text x="671" y="293" fill="#2979FF" font-size="20" font-weight="bold">-></text>

  <rect x="696" y="260" width="340" height="58" rx="12" fill="url(#g2)"/>
  <text x="866" y="282" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Step 3: API Keys (Agent-Assisted)</text>
