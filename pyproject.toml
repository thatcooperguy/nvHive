[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvhive"
version = "0.47.0"
description = "NVHive — Multi-LLM orchestration platform with intelligent routing, hive consensus, and auto-agent generation"
readme = "README.md"
requires-python = ">=3.11"
# Relicensed 2026-08-05 (owner directive: proprietary stack, no commercial
# use). Versions <= 0.40.0 were published under MIT and remain MIT; this
# governs 0.41.0+. PolyForm NC permits use, modification, and distribution
# for any noncommercial purpose only.
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "thatcooperguy and nvHive Contributors" }]
maintainers = [{ name = "thatcooperguy" }]
keywords = ["llm", "ai", "nvidia", "gpu", "orchestration", "multi-model", "agents", "ollama", "nemotron"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12",
    # >=1.99: the default model IDs and litellm.cost_per_token() need the
    # current model DB; floor unchanged, verified through 1.106.6 for 0.44.1
    # (tests/test_litellm_surface.py pins the surface).
    "litellm>=1.99",
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "keyring>=25.0",
    "rich>=13.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "anyio>=4.0",
    "zstandard>=0.20",
    "packaging>=23",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "passlib[bcrypt]>=1.7",
    # Required by FastAPI's multipart form handling — used by the RAG
    # drag-drop upload endpoint and any future file-upload route.
    "python-multipart>=0.0.6",
]
nvidia = [
    "nvidia-ml-py3>=7.352.0",
]
mcp = [
    # Both SDK majors. nvh/mcp_server.py binds mcp.server.mcpserver.MCPServer
    # (2.x) before mcp.server.fastmcp.FastMCP (1.x) and probes constructor
    # keywords; nvh/integrations/mcp_client.py reads snake_case (2.x) then
    # camelCase (1.x) attributes. No [cli] extra: nvHive never shells out to
    # `mcp dev`/`mcp install`. litellm 1.106.6 requires mcp>=2.2,<3 for its
    # own mcp/proxy extras, so a <2 ceiling would conflict with them. mcp 2.x
    # adds httpx2, httpcore2, mcp-types, truststore and opentelemetry-api
    # (API only, no exporter) to the install, wants pyjwt[crypto] and raises
    # pydantic to >=2.12 under this extra and the dev extra; mcp 1.x needs
    # none of those.
    "mcp>=1.0,<3",
]
vision = [
    "pyautogui>=0.9.54",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "Pillow>=10.0",
]
browser = [
    "playwright>=1.40",
]
rag = [
    # PDF parsing for the local RAG ingest walker. pypdf is pure-python so it
    # works on every platform we ship without a system dependency.
    "pypdf>=4.0",
]
jupyter = [
    "ipython>=8",
]
# Local speech-to-text for `nvh voice` and POST /v1/voice/transcribe (0.46 §8, O6).
# faster-whisper pulls CTranslate2 and PyAV, which ship no win_arm64 wheels, so the
# marker skips Windows on Arm: the extra installs nothing there instead of failing
# outright, and /v1/voice/status reports why. Outside `all` by design.
voice = [
    "faster-whisper>=1.0; sys_platform != 'win32' or platform_machine != 'ARM64'",
]
all = [
    "nvhive[serve,nvidia,mcp,vision,browser,rag,jupyter]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.0",
    "twine>=5.0",
    # test_mcp_client.py runs a real stdio MCP server, so the [mcp] extra is
    # part of the dev set; vision/browser stay out (display + Chromium).
    "nvhive[serve,nvidia,mcp,rag]",
]

[project.urls]
Homepage = "https://github.com/thatcooperguy/nvHive"
Repository = "https://github.com/thatcooperguy/nvHive"
Issues = "https://github.com/thatcooperguy/nvHive/issues"
Documentation = "https://github.com/thatcooperguy/nvHive/tree/main/docs"
Source = "https://github.com/thatcooperguy/nvHive"
Changelog = "https://github.com/thatcooperguy/nvHive/blob/main/CHANGELOG.md"
"Trademark Policy" = "https://github.com/thatcooperguy/nvHive/blob/main/TRADEMARKS.md"

# The plugin entry-point group CONTRIBUTING.md documents: third-party
# packages register providers / agents / cabinets here and
# nvh/plugins/manager.py discovers them. nvHive itself ships none, so the
# table is declared empty.
[project.entry-points."nvhive.plugins"]

[project.scripts]
nvh = "nvh.cli.main:main"
nvhive = "nvh.cli.main:main"
nvhive-mcp = "nvh.mcp_server:main"

[tool.setuptools.packages.find]
include = ["nvh*"]

[tool.setuptools.package-data]
nvh = ["catalog/*.json", "config/*.yaml", "config/*.json", "data/*.json", "prompts/*.md", "workflows/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "network: probes registry.ollama.ai or other remote services; opt in with NVH_NETWORK_TESTS=1",
    "slow: spawns a subprocess that does real work (nvh status/diagnostic probes, completion-tree walks, the live uvicorn API server, a stdio MCP server); deselect with -m 'not slow' for a quick local run",
]
# 2026-06-10 audit: without this, a CI image (or dev env) missing
# pytest-timeout silently drops the `timeout`/`timeout_method` options
# below — pytest emits a yellow "Unknown config option: timeout"
# warning and runs with NO per-test timeout, so a hung subprocess test
# wedges the job for the full 6h GitHub ceiling instead of failing at
# 120s. required_plugins makes that a hard startup error ("Missing
# required plugins") everywhere, converting silent degradation into a
# loud, obvious failure.
required_plugins = ["pytest-timeout", "pytest-asyncio"]
# Default per-test timeout. Any test that hangs longer than this
# fails loudly with a clear "Timeout" message instead of wedging the
# CI job for 30+ minutes. 120s is generous for the CLI subprocess
# tests which spawn `nvh` and can be slow on cold CI runners.
timeout = 120
timeout_method = "thread"
filterwarnings = [
    # aiosqlite worker thread tries to callback after event loop closes during
    # test teardown — harmless race condition, not a real error.
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    # FastAPI upstream deprecation — they need to update to HTTP_422_UNPROCESSABLE_CONTENT.
    "ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated:DeprecationWarning",
    # passlib imports deprecated crypt module — upstream issue, fixed in newer passlib.
    "ignore:'crypt' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
# Exclude CLI presentation layer from coverage metrics. These are
# Typer/Rich formatting wrappers that are smoke-tested via subprocess
# in test_cli_e2e.py but don't contribute meaningful coverage numbers
# (5000+ lines of print formatting at 6% drags the whole metric down).
# Business logic coverage is what matters for production reliability.
omit = [
    "nvh/cli/main.py",
    "nvh/cli/repl.py",
    "nvh/cli/completions.py",
    "nvh/cli/conversations.py",
]

# Strictness is a CI concern: ci.yml gates only nvh/sandbox and nvh/catalog.
[tool.mypy]
python_version = "3.11"
