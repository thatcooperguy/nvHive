name: DCO

# Developer Certificate of Origin (DCO) sign-off check.
#
# Why this exists: nvHive ships under MIT today. To preserve the option to
# relicense future versions (BUSL-1.1 + 4-year conversion to Apache-2.0, for
# example) we need every external contribution to carry a signed-off-by line
# that incorporates DCO 1.1 (https://developercertificate.org/). A signed PR
# means the contributor licenses their contribution under the same terms as
# the project and has the right to do so.
#
# Internal authors (the founder) can pass by simply using `git commit -s`.
# External contributors get a clear "please add Signed-off-by" comment on
# their PR if the check fails.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify DCO sign-off
        run: |
          # Compare against the PR's base, not main, so contributors aren't
          # blamed for unsigned commits that already exist upstream.
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          MISSING=$(git log --format='%H %ae %s' "$BASE_SHA..$HEAD_SHA" --grep="Signed-off-by:" --invert-grep)
          if [ -n "$MISSING" ]; then
            echo "::error::The following commits are missing a Signed-off-by line (DCO 1.1):"
            echo "$MISSING"
            echo ""
            echo "Fix locally with: git commit --amend --signoff   (or use -s on each commit)"
            echo "Then push with --force-with-lease."
            exit 1
          fi
          echo "All commits in this PR carry a Signed-off-by line."
