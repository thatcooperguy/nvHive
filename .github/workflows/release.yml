name: Release

# Creates official nvHive release artifacts from thatcooperguy/nvHive only.
# Forks should rename the project/package/release assets before publishing.
#
# Creates a GitHub Release on tag push with:
#   - sdist + wheel (also consumed by publish.yml for PyPI)
#   - Single-file PyInstaller binaries for Linux, macOS, Windows
#   - Source tarball (auto-attached by gh release create)
#
# The tag must match v*.*.* (e.g. v0.32.0). The version in pyproject.toml
# and nvh.__version__ must match the tag before artifacts are built.
#
# PyPI publishing is handled by .github/workflows/publish.yml, whose
# workflow file is registered with PyPI trusted publishing.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.32.0). Must already exist.'
        required: true
        type: string

# Opt into the Node.js 24 runtime for JavaScript actions ahead of the June 2,
# 2026 forced cutover (see ci.yml for the rationale).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Python wheel + sdist. These are the canonical release artifacts -
  # PyPI consumes them and users can `pip install` directly from a
  # release asset URL without PyPI at all.
  build-python:
    if: github.repository == 'thatcooperguy/nvHive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install build twine
      - name: Verify release version matches tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          expected = tag[1:] if tag.startswith("v") else tag
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          package_version = pyproject["project"]["version"]
          init_text = pathlib.Path("nvh/__init__.py").read_text()
          marker = '__version__ = "'
          runtime_version = init_text.split(marker, 1)[1].split('"', 1)[0]
          if package_version != expected or runtime_version != expected:
              raise SystemExit(
                  f"Release version mismatch: tag={tag}, "
                  f"pyproject={package_version}, nvh.__version__={runtime_version}"
              )
          PY
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: python-dist
          path: dist/

  # Single-file binaries via PyInstaller. One job per OS so the binary
  # runs on that host's libc/Frameworks without a Python install.
  #
  # --collect-all covers the dynamic imports in litellm/typer/rich that
  # PyInstaller's static analysis misses. Hidden imports are the known
  # offenders that still slip through (keyring backends, aiosqlite).
  build-binaries:
    if: github.repository == 'thatcooperguy/nvHive'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: nvh-linux-x86_64
            sep: ':'
          - os: macos-latest
            asset: nvh-macos-arm64
            sep: ':'
          - os: windows-latest
            asset: nvh-windows-x86_64.exe
            sep: ';'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[serve,nvidia]"
          pip install pyinstaller
      - name: Build binary
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --name nvh \
            --collect-all litellm \
            --collect-all typer \
            --collect-all rich \
            --collect-all keyring \
            --collect-submodules nvh \
            --hidden-import aiosqlite \
            --hidden-import keyring.backends \
            nvh/cli/main.py
      - name: Rename artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/nvh.exe "dist/${{ matrix.asset }}"
          else
            mv dist/nvh "dist/${{ matrix.asset }}"
          fi
      - name: Smoke test
        shell: bash
        run: |
          "./dist/${{ matrix.asset }}" version
      - uses: actions/upload-artifact@v5
        with:
          name: binary-${{ matrix.os }}
          path: dist/${{ matrix.asset }}

  # Aggregate all artifacts into a single GitHub Release.
  release:
    if: github.repository == 'thatcooperguy/nvHive'
    needs: [build-python, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: ls -la release-assets/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "nvHive ${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            release-assets/*
