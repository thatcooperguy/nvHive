name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-runs from the Actions tab: a red matrix (new dependency
  # resolutions after a quiet stretch, a flaky runner) can be re-run
  # without an empty commit.
  workflow_dispatch:

# Opt into the Node.js 24 runtime for JavaScript actions ahead of the June 2,
# 2026 forced cutover. All of our pinned actions (checkout@v5, setup-python@v6,
# setup-node@v5, upload-artifact@v5, codecov-action@v5) still declare Node 20
# but run cleanly on Node 24; this silences the deprecation warning and surfaces
# any incompatibility now rather than on cutover day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Python test matrix: Linux launch targets only.
  #
  # nvHive launches on rootless NVIDIA Linux desktops (Ubuntu 24.04-style
  # x86_64 VMs) and, since 0.43 (#136), on DGX Spark (GB10, aarch64 DGX OS),
  # so the suite runs on both x86_64 and arm64 runners. Keep macOS and x86
  # Windows paused; Windows on Arm (RTX Spark) joins when hardware ships.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: ubuntu-24.04-arm
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Voice extra (informational, arm64)
        # 0.46 §8 / O6: the `voice` extra (faster-whisper -> CTranslate2, PyAV) is
        # believed to have Linux aarch64 CPU wheels, but no job installed anything
        # beyond .[dev] before. This step records whether it installs and imports
        # on the arm64 runner; it never fails the matrix. The CHANGELOG entry for
        # 0.46 records the result (ship the extra, or Groq + browser only).
        if: matrix.os == 'ubuntu-24.04-arm'
        run: pip install -e ".[voice]" && python -c "import faster_whisper; print(faster_whisper.__version__)"
        continue-on-error: true
      - name: Lint
        run: python -m ruff check nvh/ tests/ --ignore E501,E402,N806,E702,F841
      - name: Test
        run: python -m pytest tests/ -v --tb=short --durations=25
      - name: Coverage (gate)
        # Coverage gate on business logic. CLI presentation is smoke-tested
        # by subprocess and excluded via pyproject.toml coverage config.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pytest tests/ --cov=nvh --cov-report=xml --cov-report=term-missing --cov-fail-under=49
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: false
        continue-on-error: true

  # MCP SDK 1.x branch of the dual-SDK shim.
  #
  # The `mcp` extra is pinned `>=1.0,<3`, so the dev extra above resolves the
  # 2.x SDK (mcp.server.mcpserver) and the matrix only ever exercises that
  # branch. nvh/mcp_server.py and nvh/integrations/mcp_client.py keep a 1.x
  # branch (mcp.server.fastmcp, camelCase attributes) for installs that hold
  # the older SDK; this job pins `mcp<2` so that branch stays green in CI
  # rather than only in a maintainer's local venv.
  mcp-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies (mcp 1.x)
        run: pip install -e ".[dev]" "mcp<2"
      - name: Show the resolved MCP SDK
        run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: Test (MCP surfaces on the 1.x SDK)
        run: python -m pytest tests/test_mcp_server.py tests/test_mcp_client.py tests/test_mcp_cabinet_sync.py tests/test_cli_mcp_group.py -v --tb=short --durations=25

  # Static type check.
  #
  # Strategy: gate on modules that currently pass strict mypy so regressions
  # there fail CI, and run a repo-wide mypy as an informational signal that
  # tracks drift. As more modules reach zero errors they join the gated list.
  # The goal is to ratchet, not to flag-day a fix of every type error.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: mypy (gated — clean modules only)
        # --strict lives here, not in pyproject: the repo-wide setting was
        # dropped in 0.42 because nothing enforced it outside these two
        # packages, and this step must keep its previous strength.
        run: python -m mypy nvh/sandbox nvh/catalog --strict --follow-imports=silent --ignore-missing-imports
      - name: mypy (informational — full tree)
        run: python -m mypy nvh/ --ignore-missing-imports || echo "::warning::mypy found errors across nvh/ (informational)"
        continue-on-error: true

  # WebUI build, typecheck, and lint on Linux.
  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node 22 is the current LTS line (until April 2027). Matches
          # NODE_MAJOR_VERSION in nvh/integrations/installs/node_runtime.py,
          # so the WebUI builds with the same Node we install on user
          # machines. Node 20 enters maintenance mode April 2026; the
          # WebUI build path shouldn't ride a runtime that's about to
          # stop receiving security fixes.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests (node --test)
        # web/lib/*.test.mjs import the .ts helpers directly via Node's type
        # stripping (unflagged since 22.18 / 23.6); no test framework in web/.
        run: npm test
      - name: Lint
        # 2026-06-10 audit: the old `npm run lint || echo warning` swallowed
        # ESLint CRASHES (exit 2: bad config / version incompatibility) exactly
        # like lint findings (exit 1), so a totally broken linter showed a green
        # check while linting nothing — which would have hidden the ESLint 10 /
        # eslint-config-next incompatibility. Keep findings non-blocking, but
        # FAIL the job when the tool itself crashes. (errexit-safe capture: the
        # job shell runs with -e, so `|| rc=$?` must catch before any test.)
        run: |
          rc=0
          npm run lint || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::eslint crashed (exit $rc) — no linting was performed"
            exit "$rc"
          elif [ "$rc" -ne 0 ]; then
            echo "::warning::webui lint produced warnings (exit $rc)"
          fi
      - name: Build
        run: npm run build

  # Dependency vulnerability scan over the project's resolved dependency set
  # (runtime plus the serve, nvidia, mcp and rag extras the dev extra pulls
  # in, and the voice extra so ctranslate2, huggingface_hub and tokenizers are
  # audited too). The voice extra is native wheels that can lag a Python
  # release, so it installs in its own non-blocking step: a missing wheel never
  # turns the job red or skips the audit of everything else. A bare `pip-audit`
  # audits the current interpreter, so the project is installed first or only
  # pip-audit's own tree is checked; the editable checkout itself has no PyPI
  # entry and is skipped. SECURITY.md describes this job;
  # tests/test_release_hardening.py pins the step order.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Install voice extra (audited when it installs)
        run: pip install -e ".[voice]"
        continue-on-error: true
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit installed dependencies
        run: pip-audit --desc --strict --skip-editable || echo "::warning::pip-audit found vulnerabilities"
        continue-on-error: true

  # Wheel build and smoke test.
  build:
    runs-on: ubuntu-latest
    needs: [test, webui]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/nvh version
          /tmp/verify/bin/nvh --help > /dev/null
          /tmp/verify/bin/nvh launch --list > /dev/null
