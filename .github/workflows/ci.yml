name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into the Node.js 24 runtime for JavaScript actions ahead of the June 2,
# 2026 forced cutover. All of our pinned actions (checkout@v5, setup-python@v6,
# setup-node@v5, upload-artifact@v5, codecov-action@v5) still declare Node 20
# but run cleanly on Node 24; this silences the deprecation warning and surfaces
# any incompatibility now rather than on cutover day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Python test matrix: Linux launch target only.
  #
  # nvHive is currently launching on rootless NVIDIA Linux cloud desktops,
  # specifically Ubuntu 24.04-style VMs with NVIDIA GPUs. Keep macOS/Windows
  # work paused until the Linux installer, wizard, and GPU journey are stable.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check nvh/ tests/ --ignore E501,E402,N806,E702,F841
      - name: Test
        run: python -m pytest tests/ -v --tb=short
      - name: Coverage (gate)
        # Coverage gate on business logic. CLI presentation is smoke-tested
        # by subprocess and excluded via pyproject.toml coverage config.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pytest tests/ --cov=nvh --cov-report=xml --cov-report=term-missing --cov-fail-under=49
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: false
        continue-on-error: true

  # Static type check.
  #
  # Strategy: gate on modules that currently pass strict mypy so regressions
  # there fail CI, and run a repo-wide mypy as an informational signal that
  # tracks drift. As more modules reach zero errors they join the gated list.
  # The goal is to ratchet, not to flag-day a fix of every type error.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: mypy (gated — clean modules only)
        run: python -m mypy nvh/sandbox nvh/catalog --follow-imports=silent --ignore-missing-imports
      - name: mypy (informational — full tree)
        run: python -m mypy nvh/ --ignore-missing-imports || echo "::warning::mypy found errors across nvh/ (informational)"
        continue-on-error: true

  # WebUI build, typecheck, and lint on Linux.
  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Node 22 is the current LTS line (until April 2027). Matches
          # NODE_MAJOR_VERSION in nvh/integrations/installs/node_runtime.py,
          # so the WebUI builds with the same Node we install on user
          # machines. Node 20 enters maintenance mode April 2026; the
          # WebUI build path shouldn't ride a runtime that's about to
          # stop receiving security fixes.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        # 2026-06-10 audit: the old `npm run lint || echo warning` swallowed
        # ESLint CRASHES (exit 2: bad config / version incompatibility) exactly
        # like lint findings (exit 1), so a totally broken linter showed a green
        # check while linting nothing — which would have hidden the ESLint 10 /
        # eslint-config-next incompatibility. Keep findings non-blocking, but
        # FAIL the job when the tool itself crashes. (errexit-safe capture: the
        # job shell runs with -e, so `|| rc=$?` must catch before any test.)
        run: |
          rc=0
          npm run lint || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::eslint crashed (exit $rc) — no linting was performed"
            exit "$rc"
          elif [ "$rc" -ne 0 ]; then
            echo "::warning::webui lint produced warnings (exit $rc)"
          fi
      - name: Build
        run: npm run build

  # Dependency vulnerability scan.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit installed dependencies
        run: pip-audit --desc --strict || echo "::warning::pip-audit found vulnerabilities"
        continue-on-error: true

  # Wheel build and smoke test.
  build:
    runs-on: ubuntu-latest
    needs: [test, webui]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/nvh version
          /tmp/verify/bin/nvh --help > /dev/null
