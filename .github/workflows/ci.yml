name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Python test matrix: Linux launch target only.
  #
  # nvHive is currently launching on rootless NVIDIA Linux cloud desktops,
  # specifically Ubuntu 24.04-style VMs with NVIDIA GPUs. Keep macOS/Windows
  # work paused until the Linux installer, wizard, and GPU journey are stable.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check nvh/ tests/ --ignore E501,E402,N806,E702,F841
      - name: Test
        run: python -m pytest tests/ -v --tb=short
      - name: Coverage (gate)
        # Coverage gate on business logic. CLI presentation is smoke-tested
        # by subprocess and excluded via pyproject.toml coverage config.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pytest tests/ --cov=nvh --cov-report=xml --cov-report=term-missing --cov-fail-under=49
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: false
        continue-on-error: true

  # WebUI build, typecheck, and lint on Linux.
  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        run: npm run lint || echo "::warning::webui lint produced warnings"
      - name: Build
        run: npm run build

  # Dependency vulnerability scan.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit installed dependencies
        run: pip-audit --desc --strict || echo "::warning::pip-audit found vulnerabilities"
        continue-on-error: true

  # Wheel build and smoke test.
  build:
    runs-on: ubuntu-latest
    needs: [test, webui]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/nvh version
          /tmp/verify/bin/nvh --help > /dev/null
